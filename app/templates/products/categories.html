{% extends "base.html" %}
{% block title %}Categories — UniMarket{% endblock %}
{% block content %}
<h1>Categories</h1>
<div class="category-grid large">
    {% for category in categories %}
    <a href="/categories/{{ category.slug }}" class="category-card">
        <h3>{{ category.name }}</h3>
        {% if category.description %}<p>{{ category.description }}</p>{% endif %}
    </a>
    {% else %}
    <p class="empty-state">No categories yet.</p>
    {% endfor %}
</div>
{% endblock %}
